<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FormCraft Admin — Submissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0F2A43; --navy-deep:#081826; --paper:#F7F5EF; --card:#FFFFFF; --green:#01411C; --green-soft:#E8F0EA; --ink:#20262C; --muted:#6B7280; --line:#E3DFD3; --gold:#B98A2E;}
  *{box-sizing:border-box;} body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
  .center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:#fff;padding:36px 32px;border-radius:12px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.08);}
  .card h2{font-family:'Fraunces',serif;margin:0 0 6px;color:var(--navy-deep);}
  .card p{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin-bottom:10px;box-sizing:border-box;}
  .err{color:#B00020;font-size:12px;margin-bottom:6px;min-height:14px;}
  button{background:var(--navy);color:#fff;border:none;padding:11px 18px;border-radius:7px;font-weight:600;font-size:14px;cursor:pointer;}
  button.secondary{background:transparent;color:var(--muted);border:1px solid var(--line);}

  .wrap{max-width:1000px;margin:0 auto;padding:30px 20px 60px;display:none;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  h1{font-family:'Fraunces', serif;font-weight:600;font-size:24px;color:var(--navy-deep);margin:0;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold);}

  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);}
  th{background:var(--navy);color:#fff;font-size:11px;text-transform:uppercase;}
  tr:hover{background:#faf9f5;}
  .view-btn, .del-btn{background:none;border:none;cursor:pointer;font-size:12px;padding:0;margin-right:10px;}
  .view-btn{color:var(--navy);}
  .del-btn{color:#B00020;}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:999;}
  .modal-content{background:#fff;border-radius:10px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .modal-row b{color:var(--navy-deep);}
  .modal-close{margin-top:14px;}
  .sig-img, .photo-img{max-width:150px;border:1px solid var(--line);border-radius:6px;margin-top:6px;}
</style>
</head>
<body>

<div class="center" id="loginScreen">
  <div class="card">
    <h2>Admin Login</h2>
    <p>Sign in to view form submissions.</p>
    <input type="text" id="username" placeholder="Username" value="admin">
    <input type="password" id="pinInput" maxlength="4" inputmode="numeric" placeholder="PIN">
    <div class="err" id="pinError"></div>
    <button style="width:100%" onclick="login()">Login</button>
  </div>
</div>

<div class="wrap" id="app">
  <div class="topbar">
    <div>
      <h1>FormCraft Admin</h1>
      <div class="tag">SUBMISSIONS DATABASE</div>
    </div>
    <button class="secondary" onclick="logout()">Logout</button>
  </div>

  <table>
    <thead><tr><th>Name</th><th>Father's Name</th><th>CNIC</th><th>Company</th><th>Designation</th><th>Submitted</th><th></th></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div id="modalBody"></div>
    <button class="secondary modal-close" onclick="document.getElementById('modal').style.display='none'">Close</button>
  </div>
</div>

<script>
async function checkAuth() {
  const res = await fetch('/api/check');
  const data = await res.json();
  if (data.authenticated) enterApp();
}
checkAuth();

async function login() {
  const username = document.getElementById('username').value;
  const pin = document.getElementById('pinInput').value;
  const res = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username, pin })
  });
  const data = await res.json();
  if (data.ok) enterApp();
  else document.getElementById('pinError').textContent = data.error;
}

function enterApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadSubmissions();
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' });
  location.reload();
}

async function loadSubmissions() {
  const res = await fetch('/api/submissions');
  const data = await res.json();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  data.submissions.forEach(s => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.name||'-'}</td><td>${s.father_name||'-'}</td><td>${s.cnic||'-'}</td><td>${s.company||'-'}</td><td>${s.designation||'-'}</td><td>${s.submitted_at}</td>
      <td><button class="view-btn" onclick="viewSubmission('${s.id}')">View</button><button class="del-btn" onclick="deleteSubmission('${s.id}')">Delete</button></td>`;
    tbody.appendChild(tr);
  });
}

async function viewSubmission(id) {
  const res = await fetch('/api/submission/' + id);
  const data = await res.json();
  if (!data.ok) return;
  const s = data.submission;
  const fields = [
    ['Name', s.name], ["Father's Name", s.father_name], ['CNIC', s.cnic], ['Age', s.age],
    ['Present Address', s.present_address], ['Permanent Address', s.permanent_address], ['Eye Color', s.eye_color],
    ['Company', s.company], ['Designation', s.designation], ['Employee ID', s.employee_id], ['Scale', s.scale],
    ['Joining Date', s.joining_date], ['Experience', s.experience], ['Total Service', s.total_service],
    ['Department', s.department], ['Backend', s.backend], ['HR Officer', s.hr_officer],
    ['Employment Status', s.employment_status], ['Contact', s.contact], ['Email', s.email], ['Remarks', s.remarks],
    ['Submitted At', s.submitted_at]
  ];
  let html = fields.map(([label, val]) => `<div class="modal-row"><span>${label}</span><b>${val || '-'}</b></div>`).join('');
  if (s.photo_base64) html += `<div><span style="font-size:12px;color:#6B7280;">Photo:</span><br><img class="photo-img" src="${s.photo_base64}"></div>`;
  if (s.signature_base64) html += `<div><span style="font-size:12px;color:#6B7280;">Signature:</span><br><img class="sig-img" src="${s.signature_base64}"></div>`;
  try {
    const docs = JSON.parse(s.document_names || '[]');
    if (docs.length) html += `<div style="margin-top:10px;font-size:12px;"><b>Attachments:</b> ${docs.join(', ')}</div>`;
  } catch(e) {}
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').style.display = 'flex';
}

async function deleteSubmission(id) {
  await fetch('/api/submission/' + id, { method: 'DELETE' });
  loadSubmissions();
}
</script>
</body>
</html>
